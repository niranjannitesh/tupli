[package]
name = "db_pg"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
db = { path = "../db" }
anyhow.workspace = true
thiserror.workspace = true
futures.workspace = true
log.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
uuid.workspace = true
time.workspace = true
rust_decimal.workspace = true
tokio-postgres = { version = "0.7.18", features = ["with-uuid-1", "with-time-0_3", "with-serde_json-1"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
postgres-native-tls = "0.5.3"
native-tls = "0.2.18"
postgres-protocol = "0.6.12"
postgres-types = "0.2.14"
bytes = "1"
fallible-iterator = "0.2"

[dev-dependencies]
env_logger.workspace = true
# For the DDL round-trip test only: `sqlgen` renders the object, this crate's
# live server runs it back. No cycle — `sqlgen` knows nothing about a driver.
sqlgen = { path = "../sqlgen" }
