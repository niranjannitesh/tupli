[workspace]
resolver = "2"
members = [
    "crates/tupli",
    "crates/ui",
    "crates/grid",
    "crates/editor",
    "crates/db",
    "crates/db_pg",
    "crates/db_redis",
    "crates/db_clickhouse",
    "crates/drivers",
    "crates/sqlgen",
    "crates/store",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main" }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["font-kit"] }
gpui_tokio = { git = "https://github.com/zed-industries/zed", branch = "main" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = { version = "1", features = ["union"] }
parking_lot = "0.12"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rust_decimal = "1"
itertools = "0.14"
ropey = "1.6"
tree-sitter = "0.25"
tree-sitter-sequel = "0.3"
nucleo-matcher = "0.3"
rmpv = "1.3"
flate2 = "1"
base64 = "0.22"
criterion = { version = "0.5", features = ["html_reports"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
